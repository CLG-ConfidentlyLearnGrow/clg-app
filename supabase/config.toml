# Supabase settings for local development (supabase start).
# The hosted project must be set to match: see README "Setting up Supabase".
project_id = "clg-app"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Confirm your CLG account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.invite]
subject = "You're invited to join CLG"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your CLG password"
content_path = "./supabase/templates/recovery.html"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.sessions]
timebox = "24h"
inactivity_timeout = "8h"
